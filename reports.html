<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnifyDrive · 运营周报</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text x='50' y='68' font-size='52' font-weight='800' fill='white' text-anchor='middle' font-family='system-ui'>U</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F4F1;
    --surface:#FFFFFF;
    --ink:#13201A;
    --ink-soft:#5B6B62;
    --ink-faint:#92A097;
    --line:#E3E8E3;
    --line-strong:#D0D8D1;
    --green:#149254;
    --green-deep:#0D6A3C;
    --green-bright:#19B062;
    --green-soft:#E4F2E9;
    --amber:#B07418;
    --amber-soft:#F8EEDA;
    --indigo:#4338ca;
    --indigo-soft:#eef2ff;
    --indigo-border:#a5b4fc;
    --shadow:0 1px 2px rgba(19,32,26,.04), 0 8px 24px -12px rgba(19,32,26,.10);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:0 20px 80px;
  }
  .wrap{max-width:880px;margin:0 auto}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:linear-gradient(var(--bg) 78%, transparent);
    z-index:20;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.01em}
  .brand .u{color:var(--ink)}
  .brand .d{color:var(--ink)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green-bright);box-shadow:0 0 0 3px var(--green-soft);position:relative}
  .dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--green-bright);opacity:.4;animation:ping 2.6s ease-out infinite}
  @keyframes ping{0%{transform:scale(.7);opacity:.5}80%,100%{transform:scale(2.4);opacity:0}}
  .topmeta{display:flex;align-items:center;gap:18px;font-size:12px;color:var(--ink-soft)}
  .topmeta b{color:var(--ink);font-weight:600}

  .hero{padding:40px 0 8px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;color:var(--green);text-transform:uppercase;font-weight:500}
  h1{font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:-.025em;line-height:1.02;margin:14px 0 10px}
  .sub{font-size:15px;color:var(--ink-soft);max-width:42ch}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{
    font-family:inherit;font-size:13px;color:var(--ink-soft);background:none;border:none;cursor:pointer;
    padding:6px 14px;border-radius:7px;font-weight:500;transition:.15s;
  }
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .toolbar .count{font-size:12px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace}

  .month{margin-bottom:14px}
  .mhead{
    width:100%;display:flex;align-items:center;gap:14px;background:none;border:none;cursor:pointer;
    padding:14px 4px 12px;font-family:inherit;text-align:left;color:var(--ink);
  }
  .mhead .my{font-size:17px;font-weight:600;letter-spacing:-.01em;font-family:'JetBrains Mono',monospace}
  .mhead .mline{flex:1;height:1px;background:var(--line)}
  .mhead .mn{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace}
  .chev{transition:transform .25s;color:var(--ink-faint)}
  .mhead[aria-expanded="false"] .chev{transform:rotate(-90deg)}
  .rows{display:grid;transition:grid-template-rows .3s ease, opacity .25s;grid-template-rows:1fr;opacity:1}
  .mhead[aria-expanded="false"] + .rows{grid-template-rows:0fr;opacity:0}
  .rows-inner{overflow:hidden;min-height:0}

  .row{
    display:grid;grid-template-columns:148px 1fr auto;align-items:center;gap:16px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:15px 18px;margin-bottom:8px;text-decoration:none;color:inherit;
    transition:border-color .15s, box-shadow .15s, transform .15s;cursor:pointer;
  }
  .row:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
  .period{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .period .tag-inline{display:block;font-size:10px;color:var(--ink-faint);margin-top:3px;letter-spacing:.02em}

  /* fixed-width metric columns for vertical alignment */
  .metrics{display:flex;align-items:center;gap:0;flex-wrap:wrap}
  .metric{display:flex;flex-direction:column;gap:2px;width:108px;flex-shrink:0}
  .metric.w96{width:96px}
  .metric.w80{width:80px}
  .metric .m-l{font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
  .metric .m-v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;letter-spacing:-.01em}
  .metric .m-v.big{font-size:17px}
  .delta{display:inline-flex;align-items:center;gap:3px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;padding:2px 6px;border-radius:6px}
  .delta.up{color:var(--green-deep);background:var(--green-soft)}
  .delta.down{color:var(--amber);background:var(--amber-soft)}

  .badge{
    font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap;
    font-family:'JetBrains Mono',monospace;
  }
  .badge.green{background:var(--green-soft);color:var(--green-deep)}
  .badge.amber{background:var(--amber-soft);color:var(--amber)}
  .badge.indigo{background:var(--indigo-soft);color:var(--indigo);border:1.5px solid var(--indigo-border)}
  .badge.ghost{background:#F2F4F2;color:var(--ink-soft)}
  .open{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);font-weight:500;white-space:nowrap}
  .row:hover .open{color:var(--green)}
  .desc-text{font-size:13px;color:var(--ink-soft);line-height:1.5}

  .row.mreport{background:linear-gradient(180deg,#fff, #fbfdfb);border-color:var(--line-strong)}

  .foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  @media (max-width:640px){
    .row{grid-template-columns:1fr;gap:12px}
    .open{display:none}
    .metrics{gap:18px}
    .metric{width:auto}
    h1{margin-top:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .dot::after{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand"><span class="dot"></span><span class="u">Unify</span><span class="d">Drive</span></div>
    <div class="topmeta">
      <span>最后更新 <b class="mono">2026-06-04</b></span>
      <span>共 <b class="mono">20</b> 期</span>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow">Weekly &amp; Monthly Performance Ledger</div>
    <h1>运营周报</h1>
    <p class="sub">运营数据与广告投放数据 · 周报 / 月报归档</p>
  </section>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="筛选报告类型">
      <button data-filter="all" aria-pressed="true">全部</button>
      <button data-filter="weekly" aria-pressed="false">周报</button>
      <button data-filter="monthly" aria-pressed="false">月报</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div id="archive"></div>

  <footer class="foot">
    <span>UnifyDrive · 独立站运营 · 广告投放复盘</span>
    <span class="mono">归档自 2025 · 20 期</span>
  </footer>

</div>

<script>
const periods = [
  // Jun 2026
  { type:'weekly', month:'2026 / 06', year:2026, mo:6,
    label:'06-05 – 06-10', gmv:16116, orders:15,
    href:'reports/2026-06-10.html' },
  { type:'weekly', month:'2026 / 06', year:2026, mo:6,
    label:'06-01 – 06-04', note:'部分周 · 4 天',
    gmv:13806, orders:15, badges:[{t:'含 5月月报',c:'green'}],
    href:'weekly/2026-06-01.html' },
  // May 2026
  { type:'weekly', month:'2026 / 05', year:2026, mo:5,
    label:'05-22 – 05-28', gmv:14280, orders:14,
    href:'weekly/2026-05-22.html' },
  { type:'weekly', month:'2026 / 05', year:2026, mo:5,
    label:'05-15 – 05-21', gmv:4405, orders:13,
    warn:'单周 GMV 骤降', href:'weekly/2026-05-15.html' },
  { type:'weekly', month:'2026 / 05', year:2026, mo:5,
    label:'05-08 – 05-15', gmv:14750, orders:13,
    href:'reports/2026-05-15.html' },
  { type:'weekly', month:'2026 / 05', year:2026, mo:5,
    label:'05-01 – 05-08', gmv:11350, orders:14,
    href:'reports/2026-05-08.html' },
  // Apr 2026
  { type:'monthly', month:'2026 / 04', year:2026, mo:4,
    label:'4月月报', note:'月度复盘',
    badges:[{t:'+58% UP6 vs 3月',c:'green'},{t:'月报',c:'indigo'}],
    mreport:true, href:'reports/2026-04-29.html' },
  { type:'weekly', month:'2026 / 04', year:2026, mo:4,
    label:'04-16 – 04-22',
    desc:'促销后复盘 · 购物车页面调整', href:'reports/2026-04-22.html' },
  { type:'weekly', month:'2026 / 04', year:2026, mo:4,
    label:'04-10 – 04-15',
    desc:'Shopify + Meta 促销首周 · 用户热力图', href:'reports/2026-04-16.html' },
  { type:'weekly', month:'2026 / 04', year:2026, mo:4,
    label:'04-01 – 04-08',
    alt:[{l:'Revenue',v:'$1,599'},{l:'ROAS',v:'2.51'}], href:'reports/2026-04-09.html' },
  { type:'monthly', month:'2026 / 04', year:2026, mo:4,
    label:'3月月报', note:'月度复盘',
    badges:[{t:'+149% 收入 vs 2月',c:'green'},{t:'月报',c:'indigo'}],
    mreport:true, href:'reports/2026-04-02.html' },
  // Mar 2026
  { type:'weekly', month:'2026 / 03', year:2026, mo:3,
    label:'03-26',
    desc:'春季促销方案 · EDM · 日本市场专属', badges:[{t:'方案',c:'ghost'}], href:'reports/2026-03-26.html' },
  { type:'weekly', month:'2026 / 03', year:2026, mo:3,
    label:'03-12 – 03-18',
    desc:'退货率分析 · 网站改版热力图', href:'reports/2026-03-19.html' },
  { type:'weekly', month:'2026 / 03', year:2026, mo:3,
    label:'03-05 – 03-11',
    alt:[{l:'YouTube',v:'$11,492'},{l:'Google',v:'$7,194'}], href:'reports/2026-03-12.html' },
  { type:'monthly', month:'2026 / 03', year:2026, mo:3,
    label:'2月月报', note:'月度复盘',
    gmv:30707, orders:36, badges:[{t:'月报',c:'indigo'}],
    mreport:true, href:'reports/2026-03-05.html' },
  // Feb 2026
  { type:'weekly', month:'2026 / 02', year:2026, mo:2,
    label:'02-05',
    desc:'官网 10 层改版方案 · $9K 广告投放', badges:[{t:'方案',c:'ghost'}], href:'reports/2026-02-05.html' },
  // Jan 2026
  { type:'weekly', month:'2026 / 01', year:2026, mo:1,
    label:'01-29',
    desc:'UC250/UC450 分析 · Banner 优化 · 购物车 1.0', href:'reports/2026-01-29.html' },
  { type:'weekly', month:'2026 / 01', year:2026, mo:1,
    label:'01-22',
    alt:[{l:'UT2',v:'$2,551'},{l:'UC250',v:'$1,452'}], href:'reports/2026-01-22.html' },
  { type:'weekly', month:'2026 / 01', year:2026, mo:1,
    label:'01-15',
    desc:'UC450PRO 页面 · Trustpilot · 弃单优化 · VAT', href:'reports/2026-01-15.html' },
  // Dec 2025
  { type:'monthly', month:'2025 / 12', year:2025, mo:12,
    label:'12月', note:'工作总结',
    desc:'GitHub 管理 · 购物车推荐 · SSD 上架 · 圣诞 Banner', href:'reports/2025-12.html' },
];

const fmt = n => '$' + n.toLocaleString('en-US');
const aov = p => p.orders ? Math.round(p.gmv / p.orders) : null;

function deltaFor(idx){
  for(let i=idx-1; i>=0; i--){
    if(periods[i].gmv && periods[i].month === periods[idx].month) return Math.round((periods[idx].gmv - periods[i].gmv) / periods[i].gmv * 100);
  }
  return null;
}

const archiveEl = document.getElementById('archive');

let currentFilter = 'all';
function render(filter='all'){
  currentFilter = filter;
  archiveEl.innerHTML='';
  const groups = {};
  let shown=0;
  periods.forEach((p,idx)=>{
    if(filter==='weekly' && p.type!=='weekly') return;
    if(filter==='monthly' && p.type!=='monthly') return;
    (groups[p.month] ||= []).push({...p,_idx:idx});
  });

  Object.entries(groups).forEach(([month,items])=>{
    const m = document.createElement('section');
    m.className='month';
    const isRecent = month==='2026 / 06' || month==='2026 / 05';
    m.innerHTML = `
      <button class="mhead" aria-expanded="${isRecent}">
        <span class="my">${month}</span>
        <span class="mline"></span>
        <span class="mn">${items.length} 期</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="rows"><div class="rows-inner"></div></div>`;
    const inner = m.querySelector('.rows-inner');

    items.forEach(p=>{
      shown++;
      const row = document.createElement('a');
      row.href=p.href||'#';
      row.className='row' + (p.mreport?' mreport':'');
      row.dataset.label=p.label;

      let contentHtml='';
      if(p.gmv){
        const a = aov(p);
        const d = deltaFor(p._idx);
        const deltaHtml = d!==null
          ? `<span class="delta ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d)}%</span>`
          : '<span style="color:var(--ink-faint);font-size:12px">—</span>';
        contentHtml = `
          <div class="metrics">
            <div class="metric"><span class="m-l">GMV</span><span class="m-v big">${fmt(p.gmv)}</span></div>
            <div class="metric w96"><span class="m-l">订单</span><span class="m-v">${p.orders} 单</span></div>
            <div class="metric w96"><span class="m-l">客单价</span><span class="m-v">${fmt(a)}</span></div>
            <div class="metric w80"><span class="m-l">环比</span><span class="m-v" style="margin-top:1px">${deltaHtml}</span></div>
          </div>`;
      } else if(p.alt){
        contentHtml = `<div class="metrics">${p.alt.map(m=>`<div class="metric"><span class="m-l">${m.l}</span><span class="m-v big">${m.v}</span></div>`).join('')}</div>`;
      } else if(p.desc){
        contentHtml = `<div class="desc-text">${p.desc}</div>`;
      }

      const warnBadge = p.warn ? `<span class="badge amber" title="${p.warn}">⚠ 异常</span>` : '';
      const extraBadges = (p.badges||[]).map(b=>`<span class="badge ${b.c}">${b.t}</span>`).join('');

      row.innerHTML = `
        <div class="period">${p.label}${p.note?`<span class="tag-inline">${p.note}</span>`:''}</div>
        ${contentHtml}
        <div style="display:flex;align-items:center;gap:10px">
          ${warnBadge}${extraBadges}
          <span class="open">查看 <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </div>`;
      inner.appendChild(row);
    });

    const head = m.querySelector('.mhead');
    head.addEventListener('click',()=>{
      const open = head.getAttribute('aria-expanded')==='true';
      head.setAttribute('aria-expanded', String(!open));
    });
    archiveEl.appendChild(m);
  });

  document.getElementById('count').textContent = `${shown} 期`;
}

document.querySelectorAll('.seg button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    render(b.dataset.filter);
  });
});

render('all');
</script>
</body>
</html>
